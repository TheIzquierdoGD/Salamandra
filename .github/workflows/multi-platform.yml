name: Build Mod (All)

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-2022

          - name: macOS
            os: macos-latest

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

          - name: iOS
            os: macos-latest
            target: iOS

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      # Keep the SDK tag in sync with mod.json for every platform.
      - name: Read SDK tag from mod.json
        id: geode_tag
        shell: pwsh
        run: |
          $geodeVersion = (Get-Content -LiteralPath 'mod.json' -Raw | ConvertFrom-Json).geode
          if ([string]::IsNullOrWhiteSpace($geodeVersion)) {
            throw 'The geode field is missing in mod.json'
          }
          $tag = if ($geodeVersion.StartsWith('v')) { $geodeVersion } else { "v$geodeVersion" }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: ${{ steps.geode_tag.outputs.tag }}
          bindings: geode-sdk/bindings
          bindings-ref: main
          combine: true
          export-pdb: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
