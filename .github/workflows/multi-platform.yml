name: Build Mod (All)

on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.config.name }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-2022
            target: Win64
          - name: macOS
            os: macos-latest
            target: MacOS
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64
          - name: iOS
            os: macos-latest
            target: iOS

    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v6.0.0-alpha.3
          cli: v4.0.1
          bindings: geode-sdk/bindings
          bindings-ref: main
          target: ${{ matrix.config.target }}
          combine: true
          export-pdb: true

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
        with:
          cli: v4.0.1

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
