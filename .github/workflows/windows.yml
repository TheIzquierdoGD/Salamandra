name: Build Mod (Base)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      # Use mod.json as the single source of truth for the Geode SDK version.
      # Geode CLI expects the Git tag with a leading 'v'.
      - name: Read Geode SDK tag from mod.json
        id: geode_tag
        shell: pwsh
        run: |
          $geodeVersion = (Get-Content -LiteralPath 'mod.json' -Raw | ConvertFrom-Json).geode
          if ([string]::IsNullOrWhiteSpace($geodeVersion)) {
            throw 'The geode field is missing in mod.json'
          }
          $tag = if ($geodeVersion.StartsWith('v')) { $geodeVersion } else { "v$geodeVersion" }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: ${{ steps.geode_tag.outputs.tag }}
          bindings: geode-sdk/bindings
          bindings-ref: main
          combine: true
          export-pdb: true

  package:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Windows Build
          path: ${{ steps.build.outputs.build-output }}
